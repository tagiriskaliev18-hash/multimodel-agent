name: Сборка DuoOS ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, 'claude/**' ]
    paths:
      - 'os/**'
      - '.github/workflows/build-iso.yml'
  pull_request:
    paths:
      - 'os/**'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: write

concurrency:
  group: duoos-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Освободить место на диске
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / /mnt

      - name: Инструменты сборки
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap squashfs-tools xorriso grub-pc-bin \
               grub-efi-amd64-bin mtools dosfstools

      - name: Сборка ISO
        run: sudo WORK_DIR=/mnt/duoos-work OUT_DIR="$GITHUB_WORKSPACE/out" ./os/build.sh

      - name: Подготовка файлов к публикации
        id: files
        run: |
          cd out
          sudo chown -R "$(id -u):$(id -g)" .
          iso="$(ls *.iso)"
          echo "iso=$iso" >> "$GITHUB_OUTPUT"
          # GitHub Releases принимает файлы до 2 ГБ — большой образ режется на части
          if [ "$(stat -c %s "$iso")" -gt 2000000000 ]; then
            split -b 1900M -d -a 1 "$iso" "$iso.part"
            rm "$iso"
            parts="$(ls "$iso".part* | tr '\n' ' ')"
            plus="$(ls "$iso".part* | sed 's/$/ +/' | tr '\n' ' ' | sed 's/ + $//')"
            printf '@echo off\r\necho Склеиваю %s ...\r\ncopy /b %s %s\r\necho Готово.\r\npause\r\n' "$iso" "$plus" "$iso" > "join-windows.bat"
            printf '#!/bin/sh\ncat %s> %s && sha256sum -c %s.sha256\n' "$parts" "$iso" "$iso" > join-linux.sh
            chmod +x join-linux.sh
          fi
          ls -la

      - name: Артефакт сборки (для PR и проверки)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: duoos-iso
          path: out/*
          retention-days: 3
          compression-level: 0

      - name: Публикация в GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: duoos-1.0-build${{ github.run_number }}
          name: DuoOS 1.0 «Genesis» — сборка ${{ github.run_number }}
          body_path: os/RELEASE_NOTES.md
          target_commitish: ${{ github.sha }}
          files: out/*
          make_latest: true
