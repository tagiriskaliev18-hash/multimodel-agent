---
showSupportUrl:      true
showKnownIssuesUrl:  false
showReleaseNotesUrl: false
requirements:
    requiredStorage: 25
    requiredRam:     2.0
    internetCheckUrl: http://connectivity-check.ubuntu.com
    check:
        - storage
        - ram
        - power
        - internet
        - root
    required:
        - storage
        - ram
        - root
geoip:
    style:    "xml"
    url:      "https://geoip.ubuntu.com/lookup"
    selector: "CountryCode"
