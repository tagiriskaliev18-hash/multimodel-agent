---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    # apt в Ubuntu 26.04 без псевдотерминала завершается с ошибкой
    - device: /dev/pts
      mountPoint: /dev/pts
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
    - device: /cdrom
      mountPoint: /cdrom
      options: [ bind ]

# Раскладка подтомов, которую понимает Timeshift (@ и @home);
# кэш и журналы — отдельно, чтобы не попадать в снимки
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/cache
      subvolume: /@cache
    - mountPoint: /var/log
      subvolume: /@log

mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:1 ]
      ssdOptions: [ discard=async ]
    - filesystem: ext4
      options: [ defaults, noatime ]
      ssdOptions: [ discard ]
    - filesystem: xfs
      options: [ defaults, noatime ]
      ssdOptions: [ discard ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
