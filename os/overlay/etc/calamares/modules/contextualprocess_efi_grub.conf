---
# На UEFI-компьютерах заменить grub-pc (BIOS) на grub-efi-amd64 до установки загрузчика.
# Пакет лежит внутри образа — интернет не нужен. Через dpkg, а не apt: apt 3 падает на
# локальном .deb с «Internal Error, Pathname to install is not absolute».
dontChroot: false
timeout: 600
firmwareType:
    bios: "-/bin/true"
    "*":
        - command: "DEBIAN_FRONTEND=noninteractive dpkg --remove --force-depends grub-gfxpayload-lists grub-pc"
          timeout: 300
        - command: "DEBIAN_FRONTEND=noninteractive dpkg -i /usr/share/aisktagos/debs/grub-efi-amd64_*.deb"
          timeout: 300
