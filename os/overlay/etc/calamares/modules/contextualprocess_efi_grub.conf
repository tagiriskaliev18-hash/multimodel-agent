---
# На UEFI-компьютерах заменить grub-pc (BIOS) на grub-efi-amd64 до установки загрузчика.
# Пакет лежит внутри образа — интернет не нужен.
dontChroot: false
timeout: 600
firmwareType:
    bios: "-/bin/true"
    "*":
        - command: "DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Use-Pty=0 install -y --no-download /usr/share/aisktagos/debs/grub-efi-amd64_*.deb"
          timeout: 600
