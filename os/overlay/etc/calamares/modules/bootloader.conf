---
efiBootLoader: "grub"
kernel: "/vmlinuz"
img: "/initrd.img"
timeout: "5"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
# Каталог EFI/ubuntu: там его ищет подписанный GRUB (Secure Boot)
efiBootloaderId: "ubuntu"
# Копия загрузчика в EFI/BOOT/BOOTX64.EFI — грузится даже на капризных прошивках
installEFIFallback: true
